    <!-- Apply the saved theme before first paint (avoids a flash) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('nws:theme');
          if (t === 'light') document.documentElement.classList.remove('dark');
        } catch (e) {}
      })();
    </script>
